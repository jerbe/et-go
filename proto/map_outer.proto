syntax = "proto3";

package proto;

option go_package = "github.com/jerbe/et-go/proto/mapouterpb;mapouterpb";

message Float3 {
  float X = 1;
  float Y = 2;
  float Z = 3;
}

message Quaternion {
  float X = 1;
  float Y = 2;
  float Z = 3;
  float W = 4;
}

message MoveInfo {
  repeated Float3 Points = 1;
  Quaternion Rotation = 2;
  int32 TurnSpeed = 3;
}

message UnitInfo {
  int64 UnitId = 1;
  int32 ConfigId = 2;
  int32 Type = 3;
  Float3 Position = 4;
  Float3 Forward = 5;
  map<int32, int64> KV = 6;
  MoveInfo MoveInfo = 7;
}

message C2M_TransferMap {
  uint32 RpcId = 1;
}

message M2C_TransferMap {
  uint32 RpcId = 1;
  int32 Error = 2;
  string Message = 3;
}

message C2M_EnterMap {
  uint32 RpcId = 1;
}

message M2C_EnterMap {
  uint32 RpcId = 1;
  int32 Error = 2;
  string Message = 3;
}

message M2C_CreateUnits {
  repeated UnitInfo Units = 1;
}

message M2C_CreateMyUnit {
  UnitInfo Unit = 1;
}

message M2C_RemoveUnits {
  repeated int64 Units = 1;
}

message M2C_StartSceneChange {
  int64 SceneInstanceId = 1;
  string SceneName = 2;
}

message C2M_PathfindingResult {
  uint32 RpcId = 1;
  Float3 Position = 2;
}

message C2M_Stop {
  uint32 RpcId = 1;
}

message M2C_PathfindingResult {
  int64 Id = 1;
  Float3 Position = 2;
  repeated Float3 Points = 3;
}

message M2C_Stop {
  int32 Error = 1;
  int64 Id = 2;
  Float3 Position = 3;
  Quaternion Rotation = 4;
}
